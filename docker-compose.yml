services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://career:career@postgres:5432/career}
      READONLY_DATABASE_URL: ${READONLY_DATABASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_STRUCTURED_OUTPUT_METHOD: ${DEEPSEEK_STRUCTURED_OUTPUT_METHOD:-function_calling}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_BATCH_SIZE: ${LLM_BATCH_SIZE:-8}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-0}
      LLM_STRUCTURED_FAST_PATH: ${LLM_STRUCTURED_FAST_PATH:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-30}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      AGENT_SEARCH_LIMIT: ${AGENT_SEARCH_LIMIT:-5}
      AGENT_TOOL_MAX_RETRIES: ${AGENT_TOOL_MAX_RETRIES:-1}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-100}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-3000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-google}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      HYBRID_CANDIDATE_LIMIT: ${HYBRID_CANDIDATE_LIMIT:-20}
      RRF_K: ${RRF_K:-60}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-30}
      RERANKER_MAX_RETRIES: ${RERANKER_MAX_RETRIES:-1}
      RERANKER_MAX_CANDIDATES: ${RERANKER_MAX_CANDIDATES:-20}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jobs}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-1000000}
      MAX_CV_BYTES: ${MAX_CV_BYTES:-2000000}
      MAX_CV_PAGES: ${MAX_CV_PAGES:-5}
      CV_TIMEOUT_SECONDS: ${CV_TIMEOUT_SECONDS:-30}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai-career-platform}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 20s
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  qdrant_data:
